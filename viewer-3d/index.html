<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101719" />
    <meta
      name="description"
      content="Bancada integrada para inspecionar modelos, render paths Bedrock, skins, poses e animações do Aspergillum."
    />
    <title>Aspergillum / Developer Workbench</title>
    <style>
      html { background: #101719; color-scheme: dark; }
      body { margin: 0; background: #101719; }
      .workbench-boot { position: fixed; inset: 0; background: #101719; }
    </style>
    <link rel="stylesheet" href="/src/workbench/styles.css" />
    <link rel="stylesheet" href="/src/styles.css" data-tool-styles="model" media="not all" />
    <link rel="stylesheet" href="/src/bedrock-renderer/styles.css" data-tool-styles="bedrock" media="not all" />
    <link rel="stylesheet" href="/src/avatar-lab/styles.css" data-tool-styles="avatar" media="not all" />
  </head>
  <body data-active-tool="pending">
    <a class="workbench-skip-link" id="workbench-skip-link" href="#tool-host">Saltar para a ferramenta ativa</a>

    <div class="workbench-shell">
      <header class="workbench-header">
        <a class="workbench-brand" href="?tool=model" data-tool-link="model" aria-label="Aspergillum Developer Workbench">
          <span class="workbench-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="workbench-brand-copy">
            <span class="workbench-eyebrow">ASPERGILLUM / DEV</span>
            <strong>3D Workbench</strong>
          </span>
        </a>

        <nav class="workbench-nav" aria-label="Ferramentas de desenvolvimento 3D">
          <a href="?tool=model" data-tool-link="model">
            <span class="nav-glyph" aria-hidden="true">◇</span>
            <span><strong>Model Lab</strong><small>Geometria e UV</small></span>
          </a>
          <a href="?tool=bedrock" data-tool-link="bedrock">
            <span class="nav-glyph" aria-hidden="true">⌁</span>
            <span><strong>Bedrock Renderer</strong><small>Render path e materiais</small></span>
          </a>
          <a href="?tool=avatar" data-tool-link="avatar">
            <span class="nav-glyph" aria-hidden="true">⌾</span>
            <span><strong>Avatar Lab</strong><small>Rig, pose e attachable</small></span>
          </a>
        </nav>

        <div class="workbench-context">
          <div class="workbench-runtime-slot" id="workbench-runtime-slot" aria-live="polite">
            <span class="workbench-runtime-fallback"><i aria-hidden="true"></i>Preparando ferramenta</span>
          </div>
          <div class="workbench-actions-slot" id="workbench-actions-slot"></div>
          <span class="workbench-version" title="Versão de referência do add-on">1.2.5</span>
        </div>
      </header>

      <main class="workbench-content">
        <section class="workbench-host" id="tool-host" aria-live="off" aria-busy="true">
          <div class="workbench-loading" role="status" aria-live="polite">
            <span class="workbench-loading-mark" aria-hidden="true"></span>
            <div><strong>Preparando a bancada</strong><span>Carregando o laboratório local</span></div>
          </div>
        </section>
      </main>

      <div class="workbench-route-status" id="workbench-route-status" role="status" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/workbench/main.js"></script>
  </body>
</html>
